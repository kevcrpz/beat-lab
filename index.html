<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23161b33%22/%3E%3Crect x=%223%22 y=%227%22 width=%222%22 height=%226%22 fill=%22%23ff5fa2%22/%3E%3Crect x=%227%22 y=%223%22 width=%222%22 height=%2210%22 fill=%22%235ad1ff%22/%3E%3Crect x=%2211%22 y=%225%22 width=%222%22 height=%228%22 fill=%22%23ff5fa2%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="engine/style.css">
</head>
<body class="theme-midnight">
<main id="app">
  <header id="album">
    <div id="cover" aria-hidden="true"></div>
    <div id="album-text">
      <p class="kicker">Album</p>
      <h1 id="album-title">Loading the album…</h1>
      <p id="album-by"></p>
      <div id="album-about"></div>
    </div>
  </header>

  <div id="notice" hidden></div>

  <section id="tracks-box" aria-label="Track list">
    <ol id="tracks"></ol>
    <label id="keep-going-label"><input type="checkbox" id="keep-going" checked> When a song ends, play the next one</label>
  </section>

  <section id="deck" aria-label="Player">
    <div id="deck-head">
      <div>
        <h2 id="song-title"></h2>
        <p id="song-meta"></p>
      </div>
      <div id="transport">
        <button id="btn-play" type="button">▶ Play</button>
        <button id="btn-edit" type="button" aria-pressed="false">✎ Edit</button>
      </div>
    </div>
    <div id="edit-tools" hidden></div>
    <div id="order"><span class="label">Play order</span><span id="order-chips"></span></div>
    <div id="sections" role="tablist" aria-label="Sections"></div>
    <div id="grid-wrap"><table id="grid"></table></div>
    <div id="scope-box">
      <canvas id="scope" width="640" height="90" aria-label="The sound wave right now"></canvas>
      <p id="scope-note">This line is the sound wave: what your speaker does, moment by moment. Press play to see it move.</p>
    </div>
  </section>
</main>

<nav id="bar" aria-label="Album tools">
  <button id="btn-draft" type="button">Test a draft</button>
  <button id="btn-wav" type="button">Download as WAV</button>
  <button id="btn-record" type="button">Record a sound</button>
  <button id="btn-problems" type="button">Checking…</button>
  <span id="status"></span>
</nav>
<p id="help"><kbd>Space</kbd> play / stop &middot; <kbd>E</kbd> edit &middot; <kbd>←</kbd> <kbd>→</kbd> previous / next song &middot; sound starts only after you click something (a browser rule)</p>

<div id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div id="panel-box">
    <div id="panel-head"><h2 id="panel-title"></h2><button id="panel-close" type="button" aria-label="Close">×</button></div>
    <div id="panel-body"></div>
  </div>
</div>

<!-- The engine. Your songs live in the songs/ folder. -->
<script src="engine/song.js"></script>
<script src="engine/synth.js"></script>
<script src="engine/editor.js"></script>
<script src="engine/draft.js"></script>
<script src="engine/recorder.js"></script>
<script src="engine/player.js"></script>
</body>
</html>
